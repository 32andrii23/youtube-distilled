<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn a YouTube video into a dense, useful local AI brief." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>YouTube Distilled</title>
    <!-- Resolves the theme before first paint. Deferring this to React would
         flash a white page at every dark-mode load. Kept in sync with
         src/theme.ts. -->
    <script>
      try {
        var mode = localStorage.getItem("youtube-distilled-theme")
        if (mode !== "light" && mode !== "dark") mode = "system"
        var dark =
          mode === "dark" ||
          (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#1e1e1e" : "#ffffff")
      } catch (error) {
        // Blocked storage just means the default light theme renders.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
